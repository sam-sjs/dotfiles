[keys]
prefix = "ctrl+a"
copy_mode = "prefix+c"
# ---------------------------------------------------------------------------
# Tabs
# ---------------------------------------------------------------------------
new_tab      = "prefix+t"
previous_tab = "ctrl+alt+left"
next_tab     = "ctrl+alt+right"
switch_tab   = "ctrl+alt+1..9"

# ---------------------------------------------------------------------------
# Pane navigation
# ---------------------------------------------------------------------------
focus_pane_left  = "alt+left"
focus_pane_right = "alt+right"
focus_pane_up    = "alt+up"
focus_pane_down  = "alt+down"

# ---------------------------------------------------------------------------
# Pane resize
# ---------------------------------------------------------------------------
resize_pane_left  = "alt+shift+left"
resize_pane_right = "alt+shift+right"
resize_pane_up    = "alt+shift+up"
resize_pane_down  = "alt+shift+down"

# ---------------------------------------------------------------------------
# Splits
# ---------------------------------------------------------------------------
split_vertical   = "alt+backslash"
split_horizontal = "alt+minus"

# ---------------------------------------------------------------------------
# Pane zoom
# ---------------------------------------------------------------------------
zoom = "alt+z"

# ---------------------------------------------------------------------------
# Sidebar
# ---------------------------------------------------------------------------
toggle_sidebar = "alt+b"

[ui]
pane_scrollbars = false
