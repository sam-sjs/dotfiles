# Allow expanded key codes
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm-ghostty:extkeys'

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 10

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# Upgrade $TERM
set -g default-terminal "screen-256color"

# Emacs key bindings in tmux command prompt (prefix + :) are better than
# vi keys, even for vim users
set -g status-keys emacs

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# Remap prefix
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse
set -g mouse on

# Slightly lighten inactive panes to approximate a translucent white overlay
#set -g window-style 'bg=#363849'
#set -g window-active-style 'bg=#24273a'

# Reload the XDG tmux config
bind R source-file '~/.config/tmux/tmux.conf'

# Vim style keys
set-window-option -g mode-keys vi

# Use xterm style escape sequences for modifiers
set -g xterm-keys on

# Start window rename prompt empty (not prefilled with current name)
bind-key , command-prompt "rename-window '%%'"

# Prefixless tmux navigation bindings
#
# Modifier model:
#   Alt/Opt + Arrow          -> select pane
#   Alt/Opt + Shift + Arrow  -> resize pane by 2 cells
#   Alt/Opt + Ctrl + Arrow   -> previous/next window
#   Alt/Opt + Ctrl + 0..9    -> select window directly
#   Alt/Opt + \              -> panes side-by-side
#   Alt/Opt + -              -> panes stacked


# Pane navigation
bind-key -n M-Left  select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up    select-pane -U
bind-key -n M-Down  select-pane -D

# Pane resize
bind-key -n M-S-Left  resize-pane -L 2
bind-key -n M-S-Right resize-pane -R 2
bind-key -n M-S-Up    resize-pane -U 2
bind-key -n M-S-Down  resize-pane -D 2

# Window navigation
bind-key -n C-M-Left  previous-window
bind-key -n C-M-Right next-window

# Direct window selection
bind-key -n C-M-0 select-window -t :0
bind-key -n C-M-1 select-window -t :1
bind-key -n C-M-2 select-window -t :2
bind-key -n C-M-3 select-window -t :3
bind-key -n C-M-4 select-window -t :4
bind-key -n C-M-5 select-window -t :5
bind-key -n C-M-6 select-window -t :6
bind-key -n C-M-7 select-window -t :7
bind-key -n C-M-8 select-window -t :8
bind-key -n C-M-9 select-window -t :9

# Splits
bind-key -n "M-\\" split-window -h -c '#{pane_current_path}'
bind-key -n M--   split-window -v -c '#{pane_current_path}'
